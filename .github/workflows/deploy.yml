name: CI-CD-Deploy

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/skyedown/pohoda-skalite-frontend
  API_IMAGE: ghcr.io/skyedown/pohoda-skalite-api

jobs:
  ci-frontend:
    name: Frontend — Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  ci-api:
    name: API — Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Check formatting
        run: npm run format:check
        working-directory: api

      - name: Lint
        run: npm run lint
        working-directory: api

      - name: Typecheck
        run: npm run typecheck
        working-directory: api

  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-api]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are compiled into the bundle here, so the storefront
      # configuration lives in GitHub rather than in the server's .env.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_RESTAURANT_EMAIL=${{ vars.VITE_RESTAURANT_EMAIL }}
            VITE_RESTAURANT_PHONE=${{ vars.VITE_RESTAURANT_PHONE }}
            VITE_PREORDER_START_TIME=${{ vars.VITE_PREORDER_START_TIME }}
            VITE_OPENING_TIME=${{ vars.VITE_OPENING_TIME }}
            VITE_LAST_ORDER_TIME=${{ vars.VITE_LAST_ORDER_TIME }}
            VITE_CLOSING_TIME=${{ vars.VITE_CLOSING_TIME }}
            VITE_COMPANY_ICO=${{ vars.VITE_COMPANY_ICO }}
            VITE_COMPANY_DIC=${{ vars.VITE_COMPANY_DIC }}
            VITE_COMPANY_IC_DPH=${{ vars.VITE_COMPANY_IC_DPH }}
            VITE_GA_ID_SK=${{ vars.VITE_GA_ID_SK }}
            VITE_GA_ID_PL=${{ vars.VITE_GA_ID_PL }}
            VITE_META_PIXEL_ID=${{ vars.VITE_META_PIXEL_ID }}
            VITE_ADMIN_NAME=${{ secrets.VITE_ADMIN_NAME }}
            VITE_ADMIN_PASSWORD=${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: /root/pohoda-skalite/deploy.sh ${{ github.sha }}
