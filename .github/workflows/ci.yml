name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [frontend, api]
    # Pushing a real, pullable image is only worth doing for real branch pushes.
    if: github.event_name == 'push'
    permissions:
      contents: read
      # Publishing to GHCR needs the token's package scope, which is not part
      # of the read-only default set at the top of this file.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase image path; github.repository preserves
      # the repo's actual case (Skyedown/…), so building the tag by hand would
      # break the push. metadata-action normalises it.
      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          # prefix= (empty) overrides metadata-action's default `sha-` prefix,
          # so the tag is the bare 40-char commit sha — deploy.sh pulls by that
          # exact sha via `github.sha`.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      # No build-args: the frontend image carries no configuration. Everything
      # it needs is written into config.js from the server's .env on startup.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [images]
    # `needs: [images]` already means both check jobs and the image build
    # succeeded. The only extra condition is branch: deploy off main only.
    if: github.ref == 'refs/heads/main'
    # Nothing here needs GITHUB_TOKEN — no checkout, no registry push.
    permissions: {}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          # Secret names kept from the original pipeline so nothing has to be
          # re-entered in the repository settings.
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Invoked through bash rather than relying on the executable bit:
          # this repo has core.fileMode=false, so a lost +x would only ever
          # show up here, as a permission-denied halfway through a release.
          script: bash /root/pohoda-skalite/deploy/deploy.sh ${{ github.sha }}
